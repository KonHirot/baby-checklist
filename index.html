<meta charset="UTF-8" />

<title>出産・育児 準備チェックリスト</title>
<style>
  :root {
    --bg: #fbf7f4;
    --card: #ffffff;
    --text: #3a3330;
    --muted: #8a807a;
    --line: #efe7e1;
    --accent: #e8859a;
    --accent-dark: #d46a82;
    --must: #e5556e;
    --must-bg: #fdecef;
    --recommend: #e8912f;
    --recommend-bg: #fdf1e2;
    --optional: #9a9088;
    --optional-bg: #f2eeea;
    --ok: #4caf8f;
    --warn: #e0a52e;
    --danger: #e5556e;
    --shadow: 0 2px 10px rgba(150, 110, 100, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 80px; }

  header.app { text-align: center; padding: 18px 0 6px; }
  header.app h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: 0.02em; }
  header.app .sub { color: var(--muted); font-size: 0.82rem; margin: 0; }

  /* countdown / date card */
  .datecard {
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    padding: 16px; margin: 14px 0;
  }
  .countdown { text-align: center; margin-bottom: 10px; }
  .countdown .big { font-size: 2rem; font-weight: 700; color: var(--accent-dark); line-height: 1.2; }
  .countdown .big small { font-size: 0.9rem; color: var(--muted); font-weight: 400; }
  .countdown .label { font-size: 0.82rem; color: var(--muted); }
  .dates { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .field { display: flex; flex-direction: column; font-size: 0.78rem; color: var(--muted); }
  .field label { margin-bottom: 3px; }
  .field input[type="date"] {
    font-size: 1rem; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--text); font-family: inherit;
  }

  /* progress */
  .progress-wrap { margin: 10px 0 0; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; }
  .progress-top b { color: var(--accent-dark); font-size: 1rem; }
  .bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); border-radius: 6px; transition: width .35s ease; }

  /* filters */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
  .filters button {
    font: inherit; font-size: 0.8rem; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--muted); cursor: pointer;
  }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filters .spacer { flex: 1; }
  .filters .reset { color: var(--muted); border-style: dashed; }

  /* sections */
  section.cat { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); margin: 14px 0; overflow: hidden; }
  .cat-head {
    display: flex; align-items: center; gap: 8px; padding: 14px 16px; cursor: pointer;
    user-select: none; background: var(--card);
  }
  .cat-head .emoji { font-size: 1.2rem; }
  .cat-head h2 { font-size: 1.02rem; margin: 0; flex: 1; }
  .cat-head .count { font-size: 0.8rem; color: var(--muted); }
  .cat-head .chev { color: var(--muted); transition: transform .2s; }
  section.cat.collapsed .chev { transform: rotate(-90deg); }
  section.cat.collapsed .cat-body { display: none; }
  .cat-body { padding: 4px 8px 10px; }

  .subhead { font-size: 0.78rem; color: var(--accent-dark); font-weight: 700; padding: 12px 10px 4px; letter-spacing: 0.03em; }

  /* task row */
  .task { display: flex; gap: 10px; padding: 9px 10px; border-radius: 12px; align-items: flex-start; }
  .task:hover { background: #faf5f2; }
  .task input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 2px 0 0;
    border: 2px solid var(--accent); border-radius: 7px; cursor: pointer; flex: 0 0 auto; position: relative; background: #fff;
  }
  .task input[type="checkbox"]:checked { background: var(--accent); }
  .task input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
    border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
  }
  .task .body { flex: 1; min-width: 0; }
  .task .title-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .task .name { font-size: 0.95rem; }
  .task.done .name { text-decoration: line-through; color: var(--muted); }
  .badge { font-size: 0.68rem; padding: 1px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
  .badge.must { color: var(--must); background: var(--must-bg); }
  .badge.recommend { color: var(--recommend); background: var(--recommend-bg); }
  .badge.optional { color: var(--optional); background: var(--optional-bg); }
  .badge.qty { color: var(--muted); background: #f4efeb; font-weight: 500; }
  .task .note { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  /* 該当なし（スキップ） */
  .task.skipped { opacity: 0.55; }
  .task.skipped .name { color: var(--muted); }
  .task.skipped input[type="checkbox"] { border-color: var(--line); background: #f4efeb; cursor: default; }
  .badge.skipped-badge { color: #fff; background: var(--optional); }
  .skip-btn {
    font: inherit; font-size: 0.68rem; align-self: center; flex: 0 0 auto;
    padding: 4px 9px; border-radius: 999px; border: 1px dashed var(--line);
    background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .skip-btn:hover { border-color: var(--optional); color: var(--text); }

  .due { font-size: 0.75rem; margin-top: 2px; display: inline-block; }
  .due.normal { color: var(--muted); }
  .due.soon { color: var(--warn); font-weight: 600; }
  .due.over { color: var(--danger); font-weight: 600; }

  .disclaimer { font-size: 0.74rem; color: var(--muted); background: #fff; border-radius: 12px; padding: 12px 14px; margin: 16px 0; box-shadow: var(--shadow); }
  footer { text-align: center; color: var(--muted); font-size: 0.72rem; margin-top: 18px; }
</style>

  <footer>体を大切に、無理せずいきましょう 🌷</footer>
</div>

    { id: "buy-belt", cat: "shopping", sub: "ママ（産後）の準備品", title: "骨盤ベルト", priority: "recommend", qty: "1", due: { base: "due", offsetDays: -14 }, note: "産後の骨盤ケアに。" },
    { id: "buy-cushion", cat: "shopping", sub: "ママ（産後）の準備品", title: "円座クッション", priority: "optional", qty: "1", due: null, note: "会陰の痛み対策に。" },

    // ---- 行政手続き（出産日基準） ----
    { id: "adm-birth", cat: "admin", title: "出生届の提出", priority: "must", due: { base: "birth", offsetDays: 14 }, note: "出産日を含めて14日以内 / 日野市役所 市民窓口課。出生証明書（産院が記入）が必要。児童手当などの同時申請もできます。" },
    { id: "adm-child", cat: "admin", title: "児童手当の認定請求", priority: "must", due: { base: "birth", offsetDays: 15 }, note: "出生の翌日から15日以内 / 日野市役所。請求者は原則、所得の高い方（パパ）名義。0〜2歳は月15,000円・所得制限なし。出生届と同時申請がスムーズ。遅れると遡って受給できません。" },
    { id: "adm-insurance", cat: "admin", title: "赤ちゃんの健康保険加入（パパの国民健康保険に）", priority: "must", due: { base: "birth", offsetDays: 14 }, note: "共働きの子は年間収入が多い方の扶養に入れるのが原則（わが家はパパ側）。日野市役所で14日以内に国保の加入届を。未就学児の均等割保険料は半額に軽減。判断に迷ったらママの共済組合にも確認を。マル乳の申請に必要なので早めに。" },
    { id: "adm-medical", cat: "admin", title: "子ども医療費助成（マル乳）の申請", priority: "must", due: { base: "birth", offsetDays: 60 }, note: "出生から2カ月以内に申請すると出生日にさかのぼって適用 / 日野市 子ども包括支援センター「みらいく」。赤ちゃんの保険加入後に。" },
    { id: "adm-lumpsum", cat: "admin", title: "出産費（出産育児一時金）の手続き", priority: "must", due: { base: "birth", offsetDays: 0 }, note: "ママの共済組合から50万円＋附加給付。産院の「直接支払制度」を使えば手続きは簡単。出産費用が50万円未満なら差額を請求できます。" },
    { id: "adm-babyfirst", cat: "admin", title: "東京都 赤ちゃんファースト・018サポートの申請", priority: "must", due: { base: "birth", offsetDays: 60 }, note: "赤ちゃんファースト＝10万円分の育児用品ギフト、018サポート＝月5,000円。オンラインで同時申請できます / 東京都。" },
    { id: "adm-ikukyu", cat: "admin", title: "育児休業手当金の申請（ママ・共済組合）", priority: "recommend", due: { base: "birth", offsetDays: 60 }, note: "公務員は雇用保険の育児休業給付金ではなく、共済組合の「育児休業手当金」（開始180日まで67%、以降50%）。さらに2025年4月からの出生後休業支援給付により、開始28日間は+13%で計80%（手取り実質10割相当）。パパが個人事業主の場合は配偶者要件が免除されるのでママ単独の取得でも対象。勤務先経由で申請。※パパ（個人事業主）自身には育休給付の制度はありません。" },
    { id: "adm-visit", cat: "admin", title: "出生通知票の提出（新生児訪問）", priority: "recommend", due: { base: "birth", offsetDays: 14 }, note: "母子手帳交付時にもらう出生通知票を提出すると、助産師・保健師が自宅に訪問してくれます / 日野市。" },
    { id: "adm-highcost", cat: "admin", title: "高額療養費の申請（帝王切開など）", priority: "optional", due: null, note: "医療費が高額になった場合 / ママの共済組合。限度額適用認定証（マイナ保険証でも可）で窓口負担が軽減されます。" },
    { id: "adm-preemie", cat: "admin", title: "未熟児養育医療給付（該当する場合）", priority: "optional", due: null, note: "低出生体重などで入院治療が必要な場合 / 日野市。" },
    { id: "adm-deduction", cat: "admin", title: "医療費控除の準備（領収書の保管）", priority: "optional", due: null, note: "パパは個人事業主なので確定申告の際に医療費控除も併せて。妊婦健診・出産・入院・通院交通費の領収書を保管しておく。" },
  ];

  const PRIORITY_ORDER = { must: 0, recommend: 1, optional: 2 };
  const PRIORITY_LABEL = { must: "必須", recommend: "推奨", optional: "あると便利" };

  // ===== 状態 =====
  const STORAGE_KEY = "shussan-ikuji-checklist";
  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        return { dueDate: s.dueDate || DEFAULT_DUE, birthDate: s.birthDate || "", checked: s.checked || {}, skipped: s.skipped || {} };
      }
    } catch (e) { /* ignore */ }
    return { dueDate: DEFAULT_DUE, birthDate: "", checked: {}, skipped: {} };
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  let currentFilter = "all";

  // ===== 日付ユーティリティ =====
  function parseDate(str) {
    if (!str) return null;
    const [y, m, d] = str.split("-").map(Number);
    if (!y || !m || !d) return null;
    return new Date(y, m - 1, d);
  }
  function today() { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
  function fmtDate(d) { return `${d.getMonth() + 1}月${d.getDate()}日`; }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

  // task -> 期限日(Date) or null
  function computeDue(task) {
    if (!task.due) return null;
    const base = task.due.base === "birth"
      ? parseDate(state.birthDate)
      : parseDate(state.dueDate);
    if (!base) return null;
    return addDays(base, task.due.offsetDays);
  }

  // ===== レンダリング =====
  const listEl = document.getElementById("list");

  function taskVisible(task) {
    if (currentFilter === "todo") return !state.checked[task.id] && !state.skipped[task.id];
    if (currentFilter === "must") return task.priority === "must";
    return true;
  }

  function render() {
    // date inputs
    document.getElementById("dueDate").value = state.dueDate || "";
    document.getElementById("birthDate").value = state.birthDate || "";

    renderCountdown();
    renderList();
    renderProgress();
    document.querySelectorAll(".filters [data-filter]").forEach((b) => {
      b.classList.toggle("active", b.dataset.filter === currentFilter);
    });
  }

  function renderCountdown() {
    const el = document.getElementById("countdown");
    const label = document.getElementById("countdown-label");
    const birth = parseDate(state.birthDate);
    if (birth) {
      const n = daysBetween(birth, today());
      if (n >= 0) {
        // 出産日が今日以前 → すでに生まれている
        el.innerHTML = `ご出産おめでとうございます 🎉`;
        label.textContent = `生後 ${n} 日目 ・ 手続きは出産日を基準に計算しています`;
      } else {
        // 出産日が未来（予定として入力された場合）
        el.innerHTML = `出産日まで あと ${Math.abs(n)} 日`;
        label.textContent = `${fmtDate(birth)} が出産日です ・ 手続きは出産日を基準に計算しています`;
      }
      return;
    }
    const due = parseDate(state.dueDate);
    if (due) {
      const n = daysBetween(today(), due);
      if (n > 0) el.innerHTML = `予定日まで あと ${n} 日`;
      else if (n === 0) el.innerHTML = `いよいよ予定日です 🌸`;
      else el.innerHTML = `予定日から ${Math.abs(n)} 日`;
      label.textContent = fmtDate(due) + " が予定日です";
    } else {
      el.textContent = "—";
      label.textContent = "予定日を入力してください";
    }
  }

  function priorityBadge(p) {
    return `<span class="badge ${p}">${PRIORITY_LABEL[p]}</span>`;
  }

  function dueBadge(task) {
    const d = computeDue(task);
    if (!d) {
      if (task.due) return `<div class="due normal">期限目安：日付を入力すると表示されます</div>`;
      return "";
    }
    const diff = daysBetween(today(), d);
    let cls = "normal", suffix;
    if (diff < 0) { cls = "over"; suffix = `（${Math.abs(diff)}日 過ぎています）`; }
    else if (diff === 0) { cls = "soon"; suffix = "（本日まで）"; }
    else if (diff <= 7) { cls = "soon"; suffix = `（あと${diff}日）`; }
    else { suffix = `（あと${diff}日）`; }
    return `<div class="due ${cls}">🗓 ${fmtDate(d)}まで ${suffix}</div>`;
  }

  function renderList() {
    listEl.innerHTML = "";
    CATEGORIES.forEach((cat) => {
      const tasks = TASKS.filter((t) => t.cat === cat.id);
      const visibleTasks = tasks.filter(taskVisible);
      // セクションのカウントも「該当なし」を分母から外す
      const activeTasks = tasks.filter((t) => !state.skipped[t.id]);
      const doneCount = activeTasks.filter((t) => state.checked[t.id]).length;

      const section = document.createElement("section");
      section.className = "cat";
      section.dataset.cat = cat.id;

      const head = document.createElement("div");
      head.className = "cat-head";
      head.innerHTML = `<span class="emoji">${cat.emoji}</span><h2>${cat.title}</h2>` +
        `<span class="count">${doneCount} / ${activeTasks.length}</span><span class="chev">▾</span>`;
      head.addEventListener("click", () => section.classList.toggle("collapsed"));
      section.appendChild(head);

      const bodyEl = document.createElement("div");
      bodyEl.className = "cat-body";

      // sort by sub-group order (keep定義順) then priority
      let lastSub = null;
      const ordered = stableSortTasks(visibleTasks);
      if (ordered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "note";
        empty.style.padding = "10px 12px";
        empty.textContent = "表示できる項目がありません（フィルタで絞り込み中）。";
        bodyEl.appendChild(empty);
      }
      ordered.forEach((task) => {
        if (task.sub && task.sub !== lastSub) {
          const sh = document.createElement("div");
          sh.className = "subhead";
          sh.textContent = task.sub;
          bodyEl.appendChild(sh);
          lastSub = task.sub;
        }
        bodyEl.appendChild(renderTask(task));
      });

      section.appendChild(bodyEl);
      listEl.appendChild(section);
    });
  }

  // グループ（sub）ごとにまとめつつ、各グループ内は優先度順に
  function stableSortTasks(tasks) {
    const subs = [];
    const map = new Map();
    tasks.forEach((t) => {
      const key = t.sub || "__nosub__";
      if (!map.has(key)) { map.set(key, []); subs.push(key); }
      map.get(key).push(t);
    });
    const out = [];
    subs.forEach((key) => {
      const arr = map.get(key).slice().sort((a, b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]);
      out.push(...arr);
    });
    return out;
  }

  function renderTask(task) {
    const isSkipped = !!state.skipped[task.id];
    const row = document.createElement("label");
    row.className = "task" + (state.checked[task.id] ? " done" : "") + (isSkipped ? " skipped" : "");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!state.checked[task.id];
    cb.disabled = isSkipped;
    cb.addEventListener("change", () => {
      if (cb.checked) state.checked[task.id] = true;
      else delete state.checked[task.id];
      saveState();
      // 再描画（進捗・カウント・フィルタ反映）
      render();
    });

    const body = document.createElement("div");
    body.className = "body";
    const qty = task.qty ? `<span class="badge qty">目安 ${task.qty}</span>` : "";
    const skippedBadge = isSkipped ? `<span class="badge skipped-badge">該当なし</span>` : "";
    body.innerHTML =
      `<div class="title-line"><span class="name">${escapeHtml(task.title)}</span>${priorityBadge(task.priority)}${qty}${skippedBadge}</div>` +
      (isSkipped ? "" : dueBadge(task)) +
      (task.note ? `<div class="note">${escapeHtml(task.note)}</div>` : "");

    // 「該当なし」トグルボタン（地域・状況によって不要な項目を対象外にできる）
    const skipBtn = document.createElement("button");
    skipBtn.type = "button";
    skipBtn.className = "skip-btn";
    skipBtn.textContent = isSkipped ? "戻す" : "該当なし";
    skipBtn.title = isSkipped ? "チェック対象に戻します" : "この項目を対象外にします（進捗の分母から外れます）";
    skipBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (isSkipped) delete state.skipped[task.id];
      else { state.skipped[task.id] = true; delete state.checked[task.id]; }
      saveState();
      render();
    });

    row.appendChild(cb);
    row.appendChild(body);
    row.appendChild(skipBtn);
    return row;
  }

  function renderProgress() {
    // 「該当なし」の項目は進捗の分母から外す
    const active = TASKS.filter((t) => !state.skipped[t.id]);
    const total = active.length;
    const done = active.filter((t) => state.checked[t.id]).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById("progText").textContent = done;
    document.getElementById("progTotal").textContent = total;
    document.getElementById("progBar").style.width = pct + "%";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ===== イベント =====
  document.getElementById("dueDate").addEventListener("change", (e) => {
    state.dueDate = e.target.value; saveState(); render();
  });
  document.getElementById("birthDate").addEventListener("change", (e) => {
    state.birthDate = e.target.value; saveState(); render();
  });
  document.querySelectorAll(".filters [data-filter]").forEach((b) => {
    b.addEventListener("click", () => { currentFilter = b.dataset.filter; render(); });
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("すべてのチェックを外します。よろしいですか？\n（入力した日付は残ります）")) {
      state.checked = {}; saveState(); render();
    }
  });

  render();
</script>
